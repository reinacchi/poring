[package]
name = "ws-bench"
description = "Reproducible WebSocket echo benchmark: Poring vs Axum (standalone; not a workspace member)."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

# Standalone: has its own lockfile so Axum never enters Poring's dependency graph.
[workspace]

[dependencies]
poring = { path = "../../crates/poring", default-features = false, features = ["websocket"] }
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "macros", "sync", "process", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 16
lto = "thin"
debug = false
