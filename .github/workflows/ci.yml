name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always

# Core checks on one pinned Linux image and toolchain. Wasm guest, guest-kit and
# cross-platform runs are local-only: `cargo test --workspace --all-features` and
# `scripts/wasm_demo.sh` still cover them.
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to `rust-version`: the trybuild snapshots in tests/ui record this
      # compiler's exact diagnostics.
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0", components: "rustfmt, clippy" }
      # The generated TypeScript client is type-checked by tests/tests/contract.rs.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g typescript@7
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p poring --all-targets --features websocket,multipart,http2 -- -D warnings
      - run: cargo clippy -p poring-macros --all-targets -- -D warnings
      - run: cargo clippy -p poring-tests -p poring-examples --all-targets --no-default-features -- -D warnings
      - run: cargo test -p poring --features websocket,multipart
      - run: cargo test -p poring-macros
      - run: cargo test -p poring-tests --no-default-features
      - run: cargo test -p poring-examples --no-default-features --example secure_admin

  features:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        flags:
          - "--no-default-features"
          - "--no-default-features --features json"
          - "--features http2"
          - "--features websocket,multipart,http2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0" }
      - run: cargo check -p poring ${{ matrix.flags }}

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0" }
      - run: cargo doc --no-deps -p poring -p poring-macros --features poring/websocket,poring/multipart,poring/http2
        env: { RUSTDOCFLAGS: "-D warnings" }
