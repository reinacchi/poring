name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to the `rust-version` toolchain: the trybuild `.stderr` snapshots in
      # tests/ui record this compiler's exact diagnostics.
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0", components: "rustfmt, clippy" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g typescript@7
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p poring-examples --example secure_admin
  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags:
          - "-p poring --no-default-features"
          - "-p poring --no-default-features --features json"
          - "-p poring --features http2"
          - "-p poring --features websocket,multipart,http2"
          - "-p poring --features wasm"
          - "-p poring --features cli"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check ${{ matrix.flags }}
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps -p poring -p poring-macros --all-features
        env: { RUSTDOCFLAGS: "-D warnings" }
  rust-guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo build --release --target wasm32-unknown-unknown
        working-directory: examples/wasm-guest
      - run: cargo run -p poring --features cli --bin cargo-poring -- poring wasm componentise examples/wasm-guest/target/wasm32-unknown-unknown/release/poring_echo_guest.wasm -o guest.wasm
      - name: serve the Rust guest and call it
        run: |
          cargo run -p poring --features cli --bin cargo-poring -- poring dev --wasm guest.wasm --addr 127.0.0.1:3000 &
          for i in $(seq 1 120); do curl -sf localhost:3000/__poring/health && break; sleep 1; done
          curl -sf localhost:3000/guest/ci | grep "rust-echo"
  wasm-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/wasm_demo.sh
