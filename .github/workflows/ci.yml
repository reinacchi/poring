name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always

# Every job pins the declared MSRV (`rust-version` = 1.97): the trybuild snapshots in
# tests/ui record this compiler's exact diagnostics.
#
# Feature isolation: `poring-tests` and `poring-examples` depend on Poring with
# `default-features = false`; every optional feature is selected explicitly here, and every
# integration test declares `required-features`. A job therefore tests exactly the features
# it names — nothing is enabled behind its back by Cargo feature unification.
#
# Heavyweight jobs (Wasm family, `--all-features`, the wasm32 guest, packaging) live in
# heavy.yml (weekly and on demand).
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p poring --all-targets --features websocket,multipart,http2,tls-rustls -- -D warnings
      - run: cargo clippy -p poring --all-targets --no-default-features -- -D warnings
      - run: cargo clippy -p poring --all-targets --no-default-features --features websocket -- -D warnings
      - run: cargo clippy -p poring-macros --all-targets -- -D warnings
      - run: cargo clippy -p poring-tests --all-targets --no-default-features --features full,http2,tls -- -D warnings
      - run: cargo clippy -p poring-tests --all-targets --no-default-features -- -D warnings
      - run: cargo clippy -p poring-examples --all-targets --no-default-features --features json,trace-flow,openapi,websocket -- -D warnings

  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@v2
      # The generated TypeScript client is type-checked by tests/tests/contract.rs, and
      # tests/interop/h2_ws_client.mjs is an independent RFC 8441 client (Node `http2`).
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g typescript@7
      - run: cargo test -p poring --features websocket,multipart,http2,tls-rustls
      - run: cargo test -p poring-macros
      # Everything except Wasm: HTTP, policies, WebSockets (HTTP/1.1, HTTP/2, TLS), multipart.
      - run: cargo test -p poring-tests --no-default-features --features full,http2,tls
      # Independent HTTP/2 client interoperability (ignored by default: needs Node).
      - run: cargo test -p poring-tests --no-default-features --features websocket,http2 --test ws_h2 -- --ignored
      - run: cargo test -p poring-examples --no-default-features --features json --example secure_admin

  features:
    name: poring ${{ matrix.flags }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        flags:
          - "--no-default-features"
          - "--no-default-features --features json"
          - "--no-default-features --features trace-flow"
          - "--no-default-features --features openapi"
          - "--no-default-features --features http2"
          - "--no-default-features --features websocket"
          - "--no-default-features --features multipart"
          - "--no-default-features --features tls-rustls"
          - "--no-default-features --features websocket,http2"
          - "--no-default-features --features websocket,multipart"
          - "--no-default-features --features websocket,multipart,http2"
          - "--no-default-features --features websocket,http2,tls-rustls"
          - ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p poring --all-targets ${{ matrix.flags }}
      - run: cargo test -p poring ${{ matrix.flags }}

  isolated-tests:
    name: integration tests --features ${{ matrix.features }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - "json,trace-flow"
          - "json,openapi,trace-flow"
          - "websocket"
          - "multipart"
          - "websocket,http2"
          - "websocket,tls"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g typescript@7
      - run: cargo test -p poring-tests --no-default-features --features ${{ matrix.features }}

  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p poring-examples --examples --no-default-features
      - run: cargo check -p poring-examples --examples --no-default-features --features json
      - run: cargo check -p poring-examples --examples --no-default-features --features websocket
      - run: cargo check -p poring-examples --examples --no-default-features --features json,trace-flow,openapi,websocket

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps -p poring -p poring-macros --features poring/websocket,poring/multipart,poring/http2,poring/tls-rustls
        env: { RUSTDOCFLAGS: "-D warnings" }
