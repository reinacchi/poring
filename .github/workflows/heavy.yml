name: heavy
# Slow, heavyweight verification that would make every pull request expensive: the Wasm
# feature family (Wasmtime), `--all-features`, the standalone wasm32 guest, the CLI demo
# and package validation. It gates merges and releases: it runs on every pull request into
# master, on every push to master, on release tags, weekly (to catch dependency and
# toolchain drift) and on demand (Actions > heavy > Run workflow). Make the `heavy-gate`
# job a required status check on master. Commands live in scripts/verify-ci.sh
# (`scripts/verify-ci.sh heavy`; `release` adds the security audit).
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  wasm-features:
    name: poring --features ${{ matrix.features }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        features: [wasm, hot-reload, guest-kit, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: bash scripts/verify-ci.sh --fail-fast wasm-features "${{ matrix.features }}"

  wasm-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with: { toolchain: "1.97.0", targets: "wasm32-unknown-unknown" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Wasm guest tests, the hot-reload demo (guest replaced in a running host; a broken
      # artefact is rejected) and the standalone Rust guest (not a workspace member).
      - run: bash scripts/verify-ci.sh --fail-fast wasm-tests

  all-features:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with: { toolchain: "1.97.0", components: "clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm install -g typescript@7.0.2
      - run: bash scripts/verify-ci.sh --fail-fast all-features

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with: { toolchain: "1.97.0" }
      - run: bash scripts/verify-ci.sh --fail-fast package

  stress-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with: { toolchain: "1.97.0" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: "benches/ws-bench" }
      # 100 connections per profile: leak and cleanup checks, not a benchmark.
      - run: bash scripts/verify-ci.sh --fail-fast stress-smoke

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with: { toolchain: "1.97.0" }
      - run: cargo install --locked cargo-audit
      # RustSec advisories for every lockfile; a vulnerability fails the job.
      - run: bash scripts/verify-ci.sh --fail-fast security

  # One required status check for branch protection and the release workflow.
  heavy-gate:
    if: always()
    needs: [wasm-features, wasm-tests, all-features, package, stress-smoke, security]
    runs-on: ubuntu-24.04
    steps:
      - name: every heavy job passed
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c 'import json,sys; n=json.load(sys.stdin); bad=[k for k,v in n.items() if v["result"]!="success"]; print("failed:",bad) if bad else print("all passed"); sys.exit(1 if bad else 0)'
