[package]
name = "poring-tests"
description = "Integration, security and compile-time tests for poring."
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["wasm-guests"]
## Wasm guest, sandbox and hot-reload tests (Wasmtime and the guest kit). Enabled by
## default for local runs; core CI runs with `--no-default-features`.
wasm-guests = ["poring/wasm", "poring/hot-reload", "poring/guest-kit"]

[dependencies]
poring = { workspace = true, features = ["websocket", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
trybuild = "1.0.122"
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
proptest = "1.12"
matchit = { workspace = true }
percent-encoding = { workspace = true }
http = { workspace = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3"

[[test]]
name = "wasm_guest"
required-features = ["wasm-guests"]

[[test]]
name = "wasm_hot_reload"
required-features = ["wasm-guests"]

[[test]]
name = "wasm_sandbox"
required-features = ["wasm-guests"]
