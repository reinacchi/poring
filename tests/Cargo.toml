[package]
name = "poring-tests"
description = "Integration, security and compile-time tests for poring."
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Everyday local runs: every lightweight feature plus the Wasm guest tests.
default = ["full", "wasm-guests"]
## All lightweight Poring features the integration tests exercise. CI runs
## `--no-default-features --features full` (no Wasm toolchain needed), and single features
## with `--no-default-features --features <name>` to prove they work in isolation.
full = ["json", "trace-flow", "openapi", "websocket", "multipart"]
json = ["poring/json"]
trace-flow = ["poring/trace-flow"]
openapi = ["poring/openapi"]
websocket = ["poring/websocket"]
multipart = ["poring/multipart"]
## Wasm guest, sandbox and hot-reload tests (Wasmtime and the guest kit).
wasm-guests = ["json", "poring/wasm", "poring/hot-reload", "poring/guest-kit"]
## HTTP/2 server tests (RFC 8441 WebSockets).
http2 = ["poring/http2"]
## Native TLS / WSS tests (`poring/tls-rustls`).
tls = ["poring/tls-rustls"]

[dependencies]
# No implicit Poring features: every optional feature is selected through the features
# above, so `--no-default-features --features X` really tests X alone.
poring = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
trybuild = "1.0.122"
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
proptest = "1.12"
matchit = { workspace = true }
percent-encoding = { workspace = true }
http = { workspace = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3"
dhat = "0.3"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Every integration test declares the Poring features it needs, so a build with fewer
# features skips it explicitly (cargo prints the skip) instead of failing or silently
# depending on feature unification.

[[test]]
name = "alloc_budget"

[[test]]
name = "composition"
required-features = ["json"]

[[test]]
name = "contract"
required-features = ["json", "openapi"]

[[test]]
name = "fluent"
required-features = ["json", "openapi", "trace-flow"]

[[test]]
name = "fluent_security"
required-features = ["json"]

[[test]]
name = "hot_path"
required-features = ["json"]

[[test]]
name = "http_core"
required-features = ["json"]

[[test]]
name = "properties"
required-features = ["json"]

[[test]]
name = "rate_limit"

[[test]]
name = "security"
required-features = ["json"]

[[test]]
name = "trace_events"
required-features = ["json"]

[[test]]
name = "trace_flow"
required-features = ["json", "trace-flow"]

[[test]]
name = "tracing_parity"

[[test]]
name = "ui"

[[test]]
name = "versions"

[[test]]
name = "multipart"
required-features = ["multipart"]

[[test]]
name = "ws_typed"
required-features = ["websocket"]

[[test]]
name = "ws_security"
required-features = ["websocket"]

[[test]]
name = "ws_lifecycle"
required-features = ["websocket"]

[[test]]
name = "ws_stress"
required-features = ["websocket"]

[[test]]
name = "ws_limits"
required-features = ["websocket"]

[[test]]
name = "ws_api"
required-features = ["websocket"]

[[test]]
name = "ws_alloc"
required-features = ["websocket"]

[[test]]
name = "ws_h2"
required-features = ["websocket", "http2"]

[[test]]
name = "tls"
required-features = ["websocket", "tls"]

[[test]]
name = "wasm_guest"
required-features = ["wasm-guests"]

[[test]]
name = "wasm_hot_reload"
required-features = ["wasm-guests"]

[[test]]
name = "wasm_sandbox"
required-features = ["wasm-guests"]
