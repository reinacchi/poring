[package]
name = "poring"
description = "Ergonomic Rust web framework built on Tokio and Hyper."
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/poring"
readme = "../../README.md"
keywords = ["web", "http", "framework", "security", "wasm"]
categories = ["web-programming::http-server", "network-programming", "wasm"]
# Tests are not part of the published crate.
exclude = ["tests/"]

[features]
default = ["json", "trace-flow", "openapi"]
## `Json<T>` extractor and response.
json = []
## Runtime flow recorder that correlates requests with flow-graph node IDs.
trace-flow = []
## OpenAPI 3.1 document and TypeScript client generation.
openapi = []
## HTTP/2 alongside HTTP/1.1.
http2 = ["hyper/http2", "hyper-util/http2", "hyper-util/server-auto"]
## Typed WebSocket routes.
websocket = ["dep:tokio-tungstenite", "dep:futures-util", "dep:data-encoding"]
## `Multipart` extractor with size and part-count limits.
multipart = ["dep:multer", "dep:futures-util"]
## Sandboxed Wasm component guest routes (Wasmtime).
wasm = ["dep:wasmtime", "dep:arc-swap", "dep:sha2"]
## Development file watcher for Wasm guest hot reload.
hot-reload = ["wasm", "dep:notify"]
## Build guest components from core WAT or Wasm modules.
guest-kit = ["wasm", "dep:wat", "dep:wit-component", "dep:wit-parser"]
## Native TLS (HTTPS/WSS) with rustls and the ring crypto provider: `poring::tls`,
## `App::bind_tls`, `App::serve_tls`. ALPN offers `h2` too when `http2` is enabled.
tls-rustls = ["dep:tokio-rustls"]
## The `cargo-poring` command-line tool.
cli = ["wasm", "hot-reload", "guest-kit", "dep:tracing-subscriber"]

[[bin]]
name = "cargo-poring"
path = "src/bin/cargo-poring/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[dependencies]
poring-macros = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync", "signal"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio", "server", "server-graceful", "http1"] }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
matchit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_html_form = { workspace = true }
percent-encoding = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
getrandom = "0.4"
smallvec = "1"
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }
data-encoding = { version = "2.6", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
multer = { version = "3", optional = true }
wasmtime = { version = "50.0.1", optional = true, default-features = false, features = ["runtime", "cranelift", "component-model", "std", "anyhow", "parallel-compilation"] }
arc-swap = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
notify = { version = "8", optional = true, default-features = false }
wat = { version = "1", optional = true }
wit-component = { version = "0.263", optional = true }
wit-parser = { version = "0.263", optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
proptest = "1.12"

[package.metadata.docs.rs]
all-features = true
